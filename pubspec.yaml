name: todovalidate
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # UI Icons
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0

  # State Management
  provider: ^6.1.2
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  equatable: ^2.0.7

  # Functional Error Handling
  dartz: ^0.10.1

  # Dependency Injection
  get_it: ^8.0.0

  # Immutable Models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Routing
  auto_route: ^9.3.0

  # Local Storage
  shared_preferences: ^2.3.5

  # UUID Generation
  uuid: ^4.3.3

  # Connectivity
  connectivity_plus: ^6.1.3

  # Loading and Error Handling
  flutter_spinkit: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15
  freezed: ^2.5.8
  auto_route_generator: ^9.3.1
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true